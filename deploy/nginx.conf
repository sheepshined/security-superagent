server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve backend through Docker's embedded DNS at request time so a
    # backend container recreate (which changes its IP) does not leave the
    # frontend proxying to a stale address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /healthz {
        proxy_pass $backend_upstream/healthz;
    }

    location = /readyz {
        proxy_pass $backend_upstream/readyz;
    }
}
