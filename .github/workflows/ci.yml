name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan tracked files for verified secrets
        run: >-
          docker run --rm
          -v "$PWD:/workspace"
          trufflesecurity/trufflehog:3.95.2
          filesystem /workspace
          --fail --only-verified --no-update

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check backend tests

      - name: Backend tests
        run: python -m pytest

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Build backend image
        run: docker build -f deploy/backend.Dockerfile -t security-superagent-backend:ci .

      - name: Build frontend image
        run: docker build -f deploy/frontend.Dockerfile -t security-superagent-frontend:ci .
