[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "security-superagent"
version = "0.1.0"
description = "Evidence-first security triage Agent and SuperAgent"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "argon2-cffi>=25.1,<26",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "langchain>=1.3,<2",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "langsmith>=0.10,<1",
  "mcp>=1.28.1,<2",
  "orjson>=3.11.5,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.12,<1",
]
ai = [
  "chromadb>=1.5.9,<2",
  "fastembed>=0.8,<1",
  "openai>=1.99,<2",
  "pypdf>=6,<7",
  "PyYAML>=6,<7",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["backend"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["backend/app"]
omit = ["backend/app/rag/cli.py"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
