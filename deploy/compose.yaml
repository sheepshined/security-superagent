services:
  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    volumes:
      - ${SECURITY_SUPERAGENT_DATA_ROOT:-E:/tzb/security-superagent-data}/runtime:/app/data/runtime
      - ${SECURITY_SUPERAGENT_DATA_ROOT:-E:/tzb/security-superagent-data}/knowledge-index:/app/knowledge/index
      - ${SECURITY_SUPERAGENT_DATA_ROOT:-E:/tzb/security-superagent-data}/knowledge-cache:/app/data/knowledge-cache
      - ${SECURITY_SUPERAGENT_DATA_ROOT:-E:/tzb/security-superagent-data}/models:/app/data/models
      - ${SECURITY_SUPERAGENT_DATA_ROOT:-E:/tzb/security-superagent-data}/certs:/app/certs:ro
    environment:
      PYTHONPATH: /app/backend
      FASTEMBED_CACHE_PATH: /app/data/models/fastembed
      KNOWLEDGE_CACHE_DIRECTORY: /app/data/knowledge-cache
    mem_limit: 2g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  knowledge-indexer:
    profiles: ["indexer"]
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    env_file:
      - ../.env
    volumes:
      - ${SECURITY_SUPERAGENT_DATA_ROOT:-E:/tzb/security-superagent-data}/knowledge-index:/app/knowledge/index
      - ${SECURITY_SUPERAGENT_DATA_ROOT:-E:/tzb/security-superagent-data}/knowledge-cache:/app/data/knowledge-cache
      - ${SECURITY_SUPERAGENT_DATA_ROOT:-E:/tzb/security-superagent-data}/models:/app/data/models
    environment:
      PYTHONPATH: /app/backend
      FASTEMBED_CACHE_PATH: /app/data/models/fastembed
      KNOWLEDGE_CACHE_DIRECTORY: /app/data/knowledge-cache
    command: ["python", "-m", "app.rag.cli", "sync", "--activate"]
    mem_limit: 3g

  mcp-gateway:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    env_file:
      - ../.env
    ports:
      - "127.0.0.1:8100:8100"
    volumes:
      - ${SECURITY_SUPERAGENT_DATA_ROOT:-E:/tzb/security-superagent-data}/runtime:/app/data/runtime
      - ${SECURITY_SUPERAGENT_DATA_ROOT:-E:/tzb/security-superagent-data}/knowledge-index:/app/knowledge/index
      - ${SECURITY_SUPERAGENT_DATA_ROOT:-E:/tzb/security-superagent-data}/models:/app/data/models
      - ${SECURITY_SUPERAGENT_DATA_ROOT:-E:/tzb/security-superagent-data}/certs:/app/certs:ro
    environment:
      PYTHONPATH: /app/backend
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8100
      FASTEMBED_CACHE_PATH: /app/data/models/fastembed
    command: ["python", "-m", "app.mcp_server"]
    # The gateway loads the active multilingual index; the measured steady-state
    # footprint is about 231 MiB, so 256 MiB leaves no safe transient headroom.
    mem_limit: 384m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8100),2); s.close()"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    mem_limit: 256m
    restart: unless-stopped
